name: Publish OpenLocalGuide
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify public release gate
        run: |
          node -e "const m=require('./site/site-manifest.json');if(!m.ready||m.preview||m.media.skipped||m.domain!=='openlocalguide.com')process.exit(1)"
          test -f site/.nojekyll
          test "$(cat site/CNAME)" = 'openlocalguide.com'
          if find site -type l | grep -q .; then exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
